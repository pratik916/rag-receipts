[project]
name = "ragreceipts"
version = "0.1.0"
description = "Adaptive RAG engine with measured ablation receipts"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109",
    "bm25s>=0.3.9,<0.4",
    "cohere>=7.0,<8",
    "datasets>=4.8.4,<5",
    "fastapi>=0.115",
    "langgraph>=1.2,<2",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.18,<2",
    "ragas>=0.4,<0.5",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
    "voyageai>=0.4,<0.5",
]

[project.scripts]
ragreceipts = "ragreceipts.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragreceipts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
