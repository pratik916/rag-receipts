[project]
name = "ragreceipts"
version = "0.1.0"
description = "Adaptive RAG engine with measured ablation receipts"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.9,<0.4",
    "cohere>=7.0,<8",
    "datasets>=4.8.4,<5",
    "qdrant-client>=1.18,<2",
    "voyageai>=0.4,<0.5",
]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragreceipts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
